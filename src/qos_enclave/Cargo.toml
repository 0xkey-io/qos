[package]
name = "qos_enclave"
version = "1.2.0"
authors = [""]
rust-version = "1.88"
edition = "2024"
publish = false

[dependencies]
# As of 8/2025, AWS doesn't have a recent crate version of aws-nitro-enclaves-cli published
# in a typical crate repository -> directly use the git version on GitHub as a workaround
#
# Pinned to a 0xkey fork that fixes a file-descriptor leak in
# enclave_proc_command_send_all (epoll fd + per-connection fds were never
# closed, exhausting RLIMIT_NOFILE for the long-running qos_enclave launcher
# that polls enclave state on a health-check interval -> EMFILE panic).
# Fix sits on top of upstream release 1.4.5; the only src delta vs the previous
# v1.4.3 pin (82501bb9) is two trivial logger/resource_manager changes plus the
# leak fix. See aws/aws-nitro-enclaves-cli PR for the upstreamed change.
# TODO(prod): move this fork to the 0xkey-io org before the prod PCR rotation.
nitro-cli = { git = "https://github.com/torbensen/aws-nitro-enclaves-cli", rev = "8938b4c32008c87ab94450be5231fec060165a8e" }
libc = "=0.2.174"

[features]
default = []
